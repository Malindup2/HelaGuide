[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helaguide-c2-knowledge-graph"
version = "0.1.0"
description = "Knowledge Graph and Service Orchestration Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # helaguide-common is installed from ../../../shared (see README)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# heavy research libraries: uncomment as you need them, install with .[research]
research = [
    # "crawl4ai>=0.4",
    # "neo4j>=5.20",
    # "python-igraph>=0.11",
    # "leidenalg>=0.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
