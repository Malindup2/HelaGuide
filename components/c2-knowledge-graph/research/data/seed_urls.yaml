# Seed pages for the PP2 milestone: five linked services, about 25 pages.
#
# Rules for this file
#   * One entry per page. `service` uses the contract id (svc:<slug>, see contracts/naming.md).
#   * Seed individual SERVICE pages, not homepages. A page worth crawling states a fee, a
#     document list or a prerequisite. Open each URL in a browser and check before setting
#     verified: true.
#   * The seed set is frozen at these five services until after 26 Oct.
#   * gic.gov.lk is deliberately not seeded: the catalogue was observed to list no services.
#   * motortraffic.gov.lk and ird.gov.lk are parked (outside the five services). motortraffic
#     also has broken TLS, handled by RELAXED_TLS_HOSTS in fetch.py.
#
# STATUS: 6 of about 25. Homepages below are starting points to be replaced by the specific
# service pages. Pages marked verified: true were read and confirmed in the Round 1 audit.

seeds:
