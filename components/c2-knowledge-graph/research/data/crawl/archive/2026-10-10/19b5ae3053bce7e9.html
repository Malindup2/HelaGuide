  <style>
  body {
    background-image: url('bg.png');
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
  }

  .logo-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .logo {
    max-width: 100%;
    height: auto;
  }

  .box-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .box {
    padding: 20px;
    text-align: center;
    border: 3px solid #362419;
    background-color: rgba(255, 255, 255, 0.5);
    width: 350px;
    height: 200px;
    margin: 10px;
    transition: background-color 0.3s ease-in-out;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 0 29px 0 rgba(68, 88, 144, 0.12);
    transition: all 0.3s ease-in-out;
    border-radius: 8px;
    z-index: 1;
    position: relative;
  }

  .box::before {
    content: "";
    position: absolute;
    background: linear-gradient(to bottom, grey, white);
    right: 0;
    left: 0;
    bottom: 0;
    top: 100%;
    transition: all 0.3s;
    z-index: -1;
  }

  .box:hover::before {
    top: 0;
  }

  .box:hover {
    background-color: transparent;
  }

  .box button {
    background:  #362419;
    color: white;
    font-size: 20px;
    border: none;
    height: 40px;
  }

  .box h4 {
    font-weight: 700;
    margin-bottom: 0px;
    font-size: 26px;
    text-align: center;
  }

  .box p {
    font-size: 18px;
    font-weight: 700;
  }

  @media screen and (max-width: 576px) {

    }

    .box p {

      font-weight: 700;
    }

    .logo-container {

      padding: 15px;
    }

    .box-container {

    }
  }

  @media screen and (min-width: 1468px) {
