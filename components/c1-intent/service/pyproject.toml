[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helaguide-c1-intent"
version = "0.1.0"
description = "Multilingual Conversational Intent and Entity Understanding Engine"
requires-python = ">=3.10"   # 3.10 for the research conda env `nlp`; the Docker image uses 3.11
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # helaguide-common is installed from ../../../shared (see README)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.18"]
# heavy research libraries for the real engine (STUB_MODE=false), install with .[research]
research = [
    "torch>=2.3",
    "transformers>=4.44",
    "matplotlib>=3.8",      # research/experiments/context_eval.py charts
    # "rasa>=3.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
